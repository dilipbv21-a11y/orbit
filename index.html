<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit — campus and alumni network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceef7;--panel:#ffffff;--panel2:#e3e5f2;--text:#1a1840;--muted:#5f5d80;--line:#d3d5e6;
  --accent:#5440dc;--accent-ink:#ffffff;--accent-soft:#e4e0ff;--gold:#c98a12;--danger:#c0392b;--ok:#1f7a52;
  --night:#17153a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12112b;--panel:#181737;--panel2:#1f1d45;--text:#e9e8fb;--muted:#a3a1c7;--line:#2e2c5c;
  --accent:#a99bff;--accent-ink:#14123a;--accent-soft:#2b2763;--gold:#f2b33d;--danger:#ff8a7a;--ok:#62d6a1;--night:#0d0c24;}}
:root[data-theme="dark"]{
  --bg:#12112b;--panel:#181737;--panel2:#1f1d45;--text:#e9e8fb;--muted:#a3a1c7;--line:#2e2c5c;
  --accent:#a99bff;--accent-ink:#14123a;--accent-soft:#2b2763;--gold:#f2b33d;--danger:#ff8a7a;--ok:#62d6a1;--night:#0d0c24;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%}
.muted{color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:6px 0}
.av{border-radius:50%;overflow:hidden;flex:none;display:inline-block;vertical-align:middle}
.av svg{display:block;width:100%;height:100%}

/* buttons & inputs */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.wide{width:100%}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.55;cursor:default;filter:none}
.link{background:none;border:0;color:var(--accent);padding:0;font-weight:500}
.iconb{background:transparent;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center;flex:none}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.badge{background:var(--gold);color:#1a1300;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:auto}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--accent-soft);color:var(--accent);flex:none}

/* auth */
.authwrap{min-height:100%;display:grid;place-items:center;padding:24px 16px;
  background:radial-gradient(1px 1px at 20% 30%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 70% 20%,#fff6 50%,transparent 51%),radial-gradient(1.5px 1.5px at 85% 70%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 35% 80%,#fff5 50%,transparent 51%),var(--night)}
.authcard{width:100%;max-width:440px;background:var(--panel);border-radius:20px;padding:28px;box-shadow:0 30px 80px -30px #000a}
.orbit{position:relative;width:200px;height:200px;margin:0 auto 8px}
.orbit .ring{position:absolute;inset:0;animation:spin 80s linear infinite}
.orbit .ring .av{position:absolute;left:50%;top:50%;margin:-17px}
.orbit .core{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.orbit .core b{font:700 30px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.5px}
.orbit::before{content:"";position:absolute;inset:17px;border:1px dashed var(--line);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orbit .ring{animation:none}}
.authcard h2{margin:6px 0 4px;font-size:22px;text-align:center}
.authcard .lede{text-align:center;color:var(--muted);margin:0 0 8px}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.inbox{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px}
.inbox b{font-size:20px;letter-spacing:4px;color:var(--accent)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.avopt{background:none;border:2px solid transparent;border-radius:50%;padding:2px;display:grid;place-items:center;aspect-ratio:1}
.avopt.sel{border-color:var(--accent)}
.avlabel{font-size:13px;color:var(--muted);margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{font-size:13px;background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:14px}

/* shell: rail | chat list | conversation */
:root{--wall:#e6e3f3;--wall-dot:#5440dc22;--bub-in:#ffffff;--bub-out:#ddd8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#0f0e26;--wall-dot:#ffffff14;--bub-in:#1f1d45;--bub-out:#3a3380}}
:root[data-theme="dark"]{--wall:#0f0e26;--wall-dot:#ffffff14;--bub-in:#1f1d45;--bub-out:#3a3380}
.shell{display:grid;height:100%;grid-template-columns:68px 340px minmax(0,1fr)}
.shell.page-mode{grid-template-columns:68px minmax(0,1fr)}
.shell.chat-mode.with-members{grid-template-columns:68px 340px minmax(0,1fr) 300px}
.rail{background:var(--panel2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.rbtn{width:48px;height:48px;border-radius:14px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:21px;gap:2px}
.rbtn:hover{background:var(--panel)}
.rbtn.on{background:var(--accent-soft)}
.rbtn small{display:none;font-size:11px;font-weight:600}
.rbtn .rb{position:absolute;top:3px;right:2px;background:var(--gold);color:#1a1300;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;line-height:16px}
.rail .spacer{flex:1}
.list{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0;min-width:0}
.lh{display:flex;align-items:center;gap:8px;padding:16px 16px 10px}
.lh h1{font-size:24px;margin:0;flex:1;letter-spacing:-.3px}
.mob-me{display:none;background:none;border:0;padding:0}
.search{padding:0 12px 10px}
.search input{border-radius:999px;background:var(--panel2);border-color:transparent;padding:8px 14px}
.chats{overflow:auto;flex:1}
.citem{display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;background:none;border:0;text-align:left}
.citem:hover{background:var(--panel2)}
.citem.on{background:var(--accent-soft)}
.ci-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);padding-bottom:10px}
.ci-r{display:flex;align-items:center;gap:8px;min-width:0}
.ci-r b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-r time{font-size:12px;color:var(--muted);flex:none}
.prev{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:3px}
.prev span.txt{overflow:hidden;text-overflow:ellipsis}
.ub{background:var(--gold);color:#1a1300;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px;flex:none}
.pinic{font-size:12px;flex:none;opacity:.7}
.gav{border-radius:50%;background:var(--panel2);display:inline-grid;place-items:center;flex:none;border:1px solid var(--line)}
.list-empty{padding:18px 16px;font-size:14px;color:var(--muted)}

.conv{display:flex;flex-direction:column;min-width:0;min-height:0;background-color:var(--wall);
  background-image:radial-gradient(var(--wall-dot) 1px,transparent 1.5px),radial-gradient(var(--wall-dot) 1px,transparent 1.5px);
  background-size:38px 38px,38px 38px;background-position:0 0,19px 19px}
.mh{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.mh-t{flex:1;min-width:0;display:flex;flex-direction:column}
.mh-t b{font:700 17px "Bricolage Grotesque",sans-serif}
.mh-t small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none}
.pinbar{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:8px 16px}
.pinbar .pt{flex:1;min-width:0;display:flex;flex-direction:column;border-left:3px solid var(--accent);padding-left:10px}
.pinbar b{font-size:12px;color:var(--accent)}
.pinbar small{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msgs{flex:1;overflow:auto;padding:14px 6%;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:min(78%,560px)}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--bub-in);border-radius:12px 12px 12px 3px;padding:6px 10px 4px;min-width:0;border:0;text-align:left;cursor:pointer;box-shadow:0 1px 1px #0000001a;display:block;width:auto}
.msg.mine .bub{background:var(--bub-out);border-radius:12px 12px 3px 12px}
.msg.flash .bub{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 1px 1px #0000001a}}
.mm{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:13px}
.mm b{color:var(--accent)}
.mm .em{font-size:11px;color:var(--muted)}
.mt{white-space:pre-wrap;overflow-wrap:anywhere}
.mf{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin-top:1px}
.tick{background:none;border:0;padding:0 1px;color:var(--muted);display:inline-flex;line-height:0;flex:none}
.tick.read{color:#2fa8e8}
.sys{align-self:center;text-align:center;font-size:12px;color:var(--muted);background:var(--panel);border-radius:8px;padding:3px 10px;margin:4px 0}
.composer{display:flex;gap:8px;align-items:center;padding:10px 16px 12px;background:var(--panel2)}
.composer input{border-radius:999px;padding:11px 16px}
.sendb{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.locked{flex:1;display:grid;place-items:center;text-align:center;padding:30px}
.locked>div{background:var(--panel);border-radius:16px;padding:24px;max-width:380px}
.locked p{color:var(--muted)}

.pagewrap{min-width:0;min-height:0;overflow:auto;background:var(--panel)}
.page{padding:20px 24px;max-width:1100px}
.ph2{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.ph2 h1{margin:0;font-size:24px;flex:1}
.page .sub{color:var(--muted);margin:0 0 16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.card .top{display:flex;gap:10px;align-items:center}
.card h3{margin:0;font-size:17px}
.card p{margin:0;font-size:14px;color:var(--muted);flex:1}
.card .meta{font-size:12px;color:var(--muted)}
.people{display:flex;flex-direction:column}
.person{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.person .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.person .pt small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.person a{color:var(--accent);text-decoration:none}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.toolbar select{width:auto}

.members{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.members h4{margin:18px 0 8px;font-size:13px;color:var(--muted)}
.mrow{display:flex;gap:10px;align-items:center;padding:7px 0}
.mrow .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.mrow .pt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .pt small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.inl{display:flex;gap:6px}
.inl input{padding:7px 10px}
.foot{margin-top:auto;padding-top:20px}

.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border-radius:18px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 4px;font-size:20px}
.modal.sheetwrap{place-items:end center}
.sheet{padding:10px !important;max-width:420px !important}
.sheet-prev{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:6px;font-size:14px;max-height:120px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:13px 12px;border-radius:10px;text-align:left;font-weight:500}
.srow:hover{background:var(--panel2)}
.srow.muted{color:var(--muted);justify-content:center}
.emogrid{display:flex;flex-wrap:wrap;gap:6px}
.emo-opt{width:40px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-size:20px}
.emo-opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.info-sec{margin-top:14px}
.info-sec h4{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:14px}
.field-hint{font-size:12px;color:var(--muted);margin-top:4px}
.divider{border:0;border-top:1px solid var(--line);margin:18px 0 4px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.btn[disabled],.link[disabled]{opacity:.55;cursor:default}
@media (max-width:1100px){
  .shell.chat-mode.with-members{grid-template-columns:68px 320px minmax(0,1fr)}
  .members{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);z-index:30;box-shadow:-20px 0 50px -20px #0007;padding-top:calc(16px + env(safe-area-inset-top,0px))}
}
@media (max-width:860px){
  .shell,.shell.page-mode,.shell.chat-mode.with-members{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 0;gap:0}
  .rbtn{width:auto;min-width:64px;height:54px;font-size:19px}
  .rbtn small{display:block}
  .rail .spacer,.rail .rme{display:none}
  .shell.chat-mode .conv{display:none}
  .shell.chat-mode.m-main .list,.shell.chat-mode.m-main .rail{display:none}
  .shell.chat-mode.m-main .conv{display:flex}
  .mob-me{display:inline-flex}
  .back{display:inline-grid}
  .msgs{padding:12px 10px}
  .msg{max-width:88%}
  .composer{padding:8px 10px 10px}
  .page{padding:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ---------- config ---------- */
const DOMAINS=['ssb.scaler.com'];
const MAIN_CHAT='Big Bang';
const MAXB=new Date().getFullYear()+2;   // batch years allowed: 2020 to current year + 2
const MAX_PINS=3;
const CATS=['Sports','Riding','Fitness','Careers','Arts','Social','Other'];
const EMOJIS=['🏏','⚽','🏍️','🚴','🏀','🏸','🎾','🏃','🧗','🎸','📸','🎮','♟️','🎓','💼','🍳','✈️','🔭'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);

/* ---------- cosmic avatars ---------- */
const S=(bg,inner)=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="64" height="64" fill="${bg}"/>${inner}</svg>`;
const dots=(c,pts)=>pts.map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`).join('');
const ST=dots('#ffffff',[[10,14,.8],[52,10,1],[56,44,.7],[8,48,.9],[46,56,.6],[20,6,.6]]);
function burst(cx,cy,n,r1,r2){const p=[];for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=Math.PI*i/n-Math.PI/2;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}return p.join(' ');}
function rays(cx,cy,n,r1,r2,c,w){let s='';for(let i=0;i<n;i++){const a=2*Math.PI*i/n;s+=`<line x1="${(cx+r1*Math.cos(a)).toFixed(1)}" y1="${(cy+r1*Math.sin(a)).toFixed(1)}" x2="${(cx+r2*Math.cos(a)).toFixed(1)}" y2="${(cy+r2*Math.sin(a)).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;}return s;}
let WH='';['#5b4bff','#7a5cff','#9b6dff','#c07dff','#e28cff','#ffffff'].forEach((c,i)=>{WH+=`<ellipse cx="32" cy="${32+i*1.6}" rx="${27-i*4.2}" ry="${13-i*2}" fill="none" stroke="${c}" stroke-width="2"/>`});
const CP=[[12,42],[22,26],[35,30],[47,16],[52,40],[36,48]];
const AVATARS=[
 ['sun','Sun',S('#2b1650',rays(32,32,12,17,26,'#ffb703',3)+'<circle cx="32" cy="32" r="13" fill="#ffc93c"/>')],
 ['moon','Crescent moon',S('#0e1b3d',ST+'<circle cx="32" cy="32" r="16" fill="#f3efd9"/><circle cx="39" cy="27" r="14" fill="#0e1b3d"/>')],
 ['fullmoon','Full moon',S('#101828',ST+'<circle cx="32" cy="32" r="18" fill="#dcd8cc"/><circle cx="26" cy="26" r="4" fill="#bdb8aa"/><circle cx="39" cy="36" r="5" fill="#bdb8aa"/><circle cx="29" cy="41" r="2.5" fill="#bdb8aa"/>')],
 ['earth','Earth',S('#06122b',ST+'<circle cx="32" cy="32" r="18" fill="#2f6fd6"/><path d="M21 25c4-5 11-4 12 0s-4 6-2 9-5 6-8 2-6-7-2-11z" fill="#43b36b"/><path d="M38 38c3-2 8-1 8 3s-5 6-8 4-3-5 0-7z" fill="#43b36b"/>')],
 ['ringed','Ringed giant',S('#1a1033',ST+'<circle cx="32" cy="32" r="13" fill="#e39b5a"/><path d="M20 30h24" stroke="#c97c3f" stroke-width="2"/><ellipse cx="32" cy="32" rx="27" ry="7" fill="none" stroke="#f6d39b" stroke-width="3" transform="rotate(-18 32 32)"/>')],
 ['comet','Comet',S('#061a2e',ST+'<path d="M44 18 L8 44 L18 54 Z" fill="#7cc7ff" opacity=".35"/><path d="M44 18 L14 42 L22 50 Z" fill="#bde0fe" opacity=".6"/><circle cx="44" cy="19" r="7" fill="#eef7ff"/>')],

}

// re-renders without disturbing whatever field you're typing in (keeps the phone keyboard open)
function syncAttrs(o,n,isInput){[...o.attributes].forEach(at=>{if(!n.hasAttribute(at.name))o.removeAttribute(at.name);});[...n.attributes].forEach(at=>{if(isInput&&at.name==='value')return;if(o.getAttribute(at.name)!==at.value)o.setAttribute(at.name,at.value);});}
function morph(html){
  const app=$('app'),a=document.activeElement;
  const full=()=>{app.innerHTML=html;};
  if(!a||!a.id||!app.contains(a)||!a.matches('input,textarea'))return full();
  const tpl=document.createElement('div');tpl.innerHTML=html;
  const twin=tpl.querySelector('#'+CSS.escape(a.id));if(!twin||twin.tagName!==a.tagName)return full();
  const oc=[],nc=[];for(let n=a;n&&n!==app;n=n.parentNode)oc.unshift(n);for(let n=twin;n&&n!==tpl;n=n.parentNode)nc.unshift(n);
  if(oc.length!==nc.length)return full();
  let op=app,np=tpl;
  for(let i=0;i<oc.length;i++){const keep=oc[i],nw=nc[i];
    [...op.childNodes].forEach(c=>{if(c!==keep)op.removeChild(c);});
    const kids=[...np.childNodes],idx=kids.indexOf(nw);
    kids.slice(0,idx).forEach(c=>op.insertBefore(c,keep));kids.slice(idx+1).forEach(c=>op.appendChild(c));
    syncAttrs(keep,nw,i===oc.length-1);op=keep;np=nw;}
}

      const ok=await run(()=>sb.from('groups').delete().eq('id',g.id),['groups','members','invites','requests','messages','pins']);if(ok){openConv('common');render();}return;}
    case 'accept':{const ok=await run(()=>sb.rpc('accept_invite',{g:g.id}),['members','invites','requests','messages','pins','reads']);if(ok){openConv(g.id);render();}return;}
    case 'declineinv':return run(()=>sb.from('group_invites').delete().eq('group_id',g.id).eq('email',meE),['invites']);
    case 'request':return run(()=>sb.from('join_requests').insert({group_id:g.id,user_id:me.id}),['requests']);
  }
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='closebg'){if(e.target===t){ui.modal=null;render();}return;}
  e.preventDefault();act(t.dataset.act,t.dataset,t);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.modal){ui.modal=null;return render();}
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  if(e.target.classList?.contains('bub')){e.preventDefault();return act('msgmenu',e.target.dataset);}
  const map={msg:'send',em:'sendotp',otp:'verify',invEm:'invite',gname:'create',nm:'finish',pname:'saveprofile'};
  const a=map[e.target.id];if(a){e.preventDefault();const btn=document.querySelector(`[data-act="${a}"]`);act(a,{},btn);}
});
document.addEventListener('change',e=>{if(e.target.id==='dirrole')filterDir();});
document.addEventListener('input',e=>{
  if(e.target.id==='batch'){const c=cleanBatch(e.target.value);if(c!==e.target.value)e.target.value=c;}
  if(e.target.id==='dirq')filterDir();
  if(e.target.id==='cq')filterChats();
});
function filterChats(){const q=val('cq').toLowerCase();document.querySelectorAll('.citem').forEach(c=>{c.style.display=!q||c.dataset.n.includes(q)?'':'none';});}
function filterDir(){const q=val('dirq').toLowerCase(),r=$('dirrole')?.value||'';document.querySelectorAll('.person').forEach(p=>{p.style.display=(!q||p.dataset.s.includes(q))&&(!r||p.dataset.r===r)?'':'none';});}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&booted)refresh(ALL);});
if(!sb){renderAuth();}
else{
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{
    if((ev==='INITIAL_SESSION'||ev==='SIGNED_IN')&&session&&(!AUTH||AUTH.id!==session.user.id))boot(session.user);
    else if(ev==='INITIAL_SESSION'&&!session){auth.step='email';renderAuth();}
    else if(ev==='SIGNED_OUT'&&AUTH)signedOut();
  },0);});
}
</script>
</body>
</html>
